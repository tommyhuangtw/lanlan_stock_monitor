name: Stock Price Monitor

on:
  schedule:
    # TW pre-market: 07:00 TWN = 23:00 UTC (previous day), 2hr before open
    - cron: '0 23 * * 0-4'
    # TW post-open: 11:00 TWN = 03:00 UTC, 2hr after open
    - cron: '0 3 * * 1-5'
    # US pre-market: 07:30 ET = 11:30 UTC, 2hr before open
    - cron: '30 11 * * 1-5'
    # US post-open: 11:30 ET = 15:30 UTC, 2hr after open
    - cron: '30 15 * * 1-5'
  workflow_dispatch:
    inputs:
      market:
        description: 'Market filter (US or TW, leave empty for all)'
        required: false
        type: string
      backfill:
        description: 'Backfill historical prices for new stocks'
        required: false
        type: boolean
        default: false

jobs:
  stock-monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Determine market filter
        id: market
        run: |
          # For scheduled runs, determine market based on time
          if [ "${{ github.event_name }}" = "schedule" ]; then
            HOUR=$(date -u +%H)
            if [ "$HOUR" = "23" ] || [ "$HOUR" = "03" ]; then
              echo "filter=TW" >> $GITHUB_OUTPUT
              echo "Running TW market check"
            elif [ "$HOUR" = "11" ] || [ "$HOUR" = "15" ]; then
              echo "filter=US" >> $GITHUB_OUTPUT
              echo "Running US market check"
            else
              echo "filter=" >> $GITHUB_OUTPUT
            fi
          else
            echo "filter=${{ inputs.market }}" >> $GITHUB_OUTPUT
          fi

      - name: Run stock monitor
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
          UNSUBSCRIBE_SECRET: ${{ secrets.UNSUBSCRIBE_SECRET }}
        run: |
          ARGS=""
          if [ -n "${{ steps.market.outputs.filter }}" ]; then
            ARGS="$ARGS --market ${{ steps.market.outputs.filter }}"
          fi
          if [ "${{ inputs.backfill }}" = "true" ]; then
            ARGS="$ARGS --backfill"
          fi
          npx tsx scripts/stock-monitor.ts $ARGS
